{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <h2 class="text-center mb-4 fw-bold" style="color: var(--text-dark);">🧬 AI Risk Prediction System</h2>
        <p class="text-center text-muted mb-5">Screening for Polycystic Ovary Syndrome (PCOS)</p>

        <!-- RESULT CARD (Shows after submit) -->
        {% if result %}
        <div class="card shadow-lg border-{{ result.color }} mb-5">
            <div class="card-body text-center p-5">
                <h4 class="text-uppercase text-muted">Risk Probability</h4>
                <h1 class="display-1 fw-bold text-{{ result.color }}">{{ result.score }}%</h1>
                <h3 class="badge bg-{{ result.color }} fs-5 px-4 py-2 mt-2">{{ result.level }}</h3>
                <p class="mt-4 fs-5">{{ result.msg }}</p>
                
                <hr>
                <a href="/risk_assessment" class="btn btn-outline-dark rounded-pill">Test Again</a>
            </div>
        </div>
        {% else %}

        <!-- ASSESSMENT FORM -->
        <div class="card shadow border-0 p-4">
            <div class="card-body">
                <form method="POST">
                    <!-- BMI Input -->
                    <div class="mb-4">
                        <label class="form-label fw-bold">1. What is your BMI? (Approx)</label>
                        <input type="number" step="0.1" name="bmi" class="form-control" placeholder="e.g. 24.5" required>
                        <div class="form-text">BMI = Weight(kg) / Height(m)²</div>
                    </div>

                    <!-- Cycle Regularity -->
                    <div class="mb-4">
                        <label class="form-label fw-bold">2. Are your periods regular?</label>
                        <select name="cycle_regularity" class="form-select" required>
                            <option value="regular">Yes, fairly regular (21-35 days)</option>
                            <option value="irregular">No, they are unpredictable or absent</option>
                        </select>
                    </div>

                    <!-- Symptoms Check -->
                    <label class="form-label fw-bold mb-2">3. Additional Symptoms</label>
                    
                    <div class="p-3 bg-light rounded mb-4">
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" name="weight_gain" value="yes">
                            <label class="form-check-label">Unexplained Weight Gain</label>
                        </div>
                        <div class="form-check mb-2">
                            <input class="form-check-input" type="checkbox" name="hair_growth" value="yes">
                            <label class="form-check-label">Excess facial/body hair (Hirsutism)</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="acne" value="yes">
                            <label class="form-check-label">Severe or Cystic Acne</label>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 btn-lg shadow-sm">Run AI Analysis</button>
                </form>
            </div>
        </div>
        {% endif %}
    </div>
</div>
{% endblock %}
